name: Experiment 001 smoke

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - '.github/workflows/experiment-001-smoke.yml'
  workflow_dispatch:
    inputs:
      hiyal_grid:
        description: 'Run full Hiyal-backed 18-cell exploratory grid (10 pairs) and archive all evidence'
        type: boolean
        required: false
        default: false
      grid_first_seed:
        description: 'First paired-society seed for the full grid'
        type: string
        required: false
        default: '74000'
      exploratory_batch:
        description: 'Also run 20 paired societies with 200 steps per arm'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: experiment001-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # replicate-001.sh records the PR head, the merge checkout's second parent.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check evidence scripts syntax
        run: bash -n scripts/replicate-001.sh scripts/verify-001.sh

      - name: Check analytic prediction and exploratory sample-size calculator
        run: |
          cargo run --locked --bin design -- experiments/001-emergence-of-inequality/results/replicated-74000/hiyal-trajectories.csv
      - name: Test Rust model and Hiyal fork integration
        run: cargo test --locked
      - name: Tiny exploratory smoke
        run: cargo run --locked -- pilot /tmp/social-lab-smoke 2 15 42
      - name: Independently replay both Hiyal event journals
        run: |
          cargo run --locked --bin validate -- /tmp/social-lab-smoke/seed-00000000000000000042/arms/control
          cargo run --locked --bin validate -- /tmp/social-lab-smoke/seed-00000000000000000042/arms/treatment
      - name: Pair-level analysis smoke
        run: cargo run --locked --bin analyze -- /tmp/social-lab-smoke/results.csv
      - name: Reference-model sensitivity smoke
        run: |
          cargo run --locked --bin sensitivity -- /tmp/lab-reference-smoke 10 40000
          cat /tmp/lab-reference-smoke/reference-sensitivity-summary.csv
      - name: Hiyal sensitivity and trajectory integration smoke
        run: |
          cargo run --locked --bin hiyal-grid -- smoke /tmp/hiyal-grid-smoke 1 62000
          cat /tmp/hiyal-grid-smoke/hiyal-summary.csv
          cat /tmp/hiyal-grid-smoke/hiyal-benchmarks.csv
      - name: Evidence pipeline smoke (generate, seal and verify)
        run: bash scripts/replicate-001.sh /tmp/hiyal-evidence-smoke 62000 smoke 1
      - name: Optional full 18-cell Hiyal grid with sealed evidence
        if: github.event_name == 'workflow_dispatch' && inputs.hiyal_grid
        env:
          GRID_FIRST_SEED: ${{ inputs.grid_first_seed }}
        run: |
          out="/tmp/hiyal-replicated-$GRID_FIRST_SEED"
          bash scripts/replicate-001.sh "$out" "$GRID_FIRST_SEED"
          echo "SHA256SUMS sha256: $(sha256sum "$out/SHA256SUMS" | cut -d' ' -f1)"
          echo "Sealed files: $(wc -l < "$out/SHA256SUMS")"
          # Committed copies are checked against SHA256SUMS, so print it and
          # the small derived files in full.
          for f in SHA256SUMS hiyal-summary.csv hiyal-trajectories.csv hiyal-benchmarks.csv study-plan.json hiyal-study-report.json reproducibility-manifest.json; do
            echo "BEGIN-EVIDENCE-FILE:$f"
            cat "$out/$f"
            echo
            echo "END-EVIDENCE-FILE:$f"
          done
      - name: Archive full sealed evidence
        if: github.event_name == 'workflow_dispatch' && inputs.hiyal_grid
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-10pair-full-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          path: /tmp/hiyal-replicated-${{ inputs.grid_first_seed }}/
      - name: Optional exploratory batch (not confirmatory)
        if: github.event_name == 'workflow_dispatch' && inputs.exploratory_batch
        run: |
          cargo run --locked -- pilot /tmp/social-lab-pilot 20 200 2000
          awk -F, 'NR>1 {if ($2=="control") {c+=$5;n++} else if ($2=="treatment") {t+=$5}} END {printf "Exploratory mean Gini control=%0.6f treatment=%0.6f delta=%0.6f across %d societies\n", c/n, t/n, (t-c)/n, n}' /tmp/social-lab-pilot/results.csv
      - name: Preserve manual-pilot output
        if: github.event_name == 'workflow_dispatch' && inputs.exploratory_batch
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-exploratory-pilot
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/social-lab-pilot/results.csv
            /tmp/social-lab-pilot/pilot-summary.json
