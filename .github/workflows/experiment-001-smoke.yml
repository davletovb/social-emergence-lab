name: Experiment 001 smoke

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - '.github/workflows/experiment-001-smoke.yml'
  workflow_dispatch:
    inputs:
      hiyal_grid:
        description: 'Run full Hiyal-backed 18-cell exploratory grid (10 pairs)'
        type: boolean
        required: false
        default: false
      exploratory_batch:
        description: 'Also run 20 paired societies with 200 steps per arm'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: experiment001-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust model and Hiyal fork integration
        run: cargo test --locked
      - name: Tiny exploratory smoke
        run: cargo run --locked -- pilot /tmp/social-lab-smoke 2 15 42
      - name: Independently replay both Hiyal event journals
        run: |
          cargo run --locked --bin validate -- /tmp/social-lab-smoke/seed-00000000000000000042/arms/control
          cargo run --locked --bin validate -- /tmp/social-lab-smoke/seed-00000000000000000042/arms/treatment
      - name: Pair-level analysis smoke
        run: cargo run --locked --bin analyze -- /tmp/social-lab-smoke/results.csv
      - name: Reference-model sensitivity smoke
        run: |
          cargo run --locked --bin sensitivity -- /tmp/lab-reference-smoke 10 40000
          cat /tmp/lab-reference-smoke/reference-sensitivity-summary.csv
      - name: Hiyal sensitivity and trajectory integration smoke
        run: |
          cargo run --locked --bin hiyal-grid -- smoke /tmp/hiyal-grid-smoke 1 62000
          cat /tmp/hiyal-grid-smoke/hiyal-summary.csv
          cat /tmp/hiyal-grid-smoke/hiyal-benchmarks.csv
      - name: One-seed Hiyal 18-cell exploratory scaling profile
        run: |
          cargo run --locked --release --bin hiyal-grid -- grid /tmp/hiyal-grid-profile 1 64000
          cat /tmp/hiyal-grid-profile/hiyal-summary.csv
          cat /tmp/hiyal-grid-profile/hiyal-benchmarks.csv
          cat /tmp/hiyal-grid-profile/hiyal-trajectories.csv
      - name: Optional Hiyal 18-cell exploratory grid
        if: github.event_name == 'workflow_dispatch' && inputs.hiyal_grid
        run: |
          cargo run --locked --release --bin hiyal-grid -- grid /tmp/hiyal-grid-full 10 63000
          cat /tmp/hiyal-grid-full/hiyal-summary.csv
      - name: Archive manually requested Hiyal-grid derived evidence
        if: github.event_name == 'workflow_dispatch' && inputs.hiyal_grid
        uses: actions/upload-artifact@v4
        with:
          name: hiyal-grid-exploratory-derived
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/hiyal-grid-full/study-plan.json
            /tmp/hiyal-grid-full/hiyal-trajectories.csv
            /tmp/hiyal-grid-full/hiyal-summary.csv
            /tmp/hiyal-grid-full/hiyal-benchmarks.csv
            /tmp/hiyal-grid-full/hiyal-study-report.json
      - name: Optional exploratory batch (not confirmatory)
        if: github.event_name == 'workflow_dispatch' && inputs.exploratory_batch
        run: |
          cargo run --locked -- pilot /tmp/social-lab-pilot 20 200 2000
          awk -F, 'NR>1 {if ($2=="control") {c+=$5;n++} else if ($2=="treatment") {t+=$5}} END {printf "Exploratory mean Gini control=%0.6f treatment=%0.6f delta=%0.6f across %d societies\n", c/n, t/n, (t-c)/n, n}' /tmp/social-lab-pilot/results.csv
      - name: Preserve manual-pilot output
        if: github.event_name == 'workflow_dispatch' && inputs.exploratory_batch
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-exploratory-pilot
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/social-lab-pilot/results.csv
            /tmp/social-lab-pilot/pilot-summary.json
