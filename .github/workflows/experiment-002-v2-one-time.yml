name: Experiment 002 V2 paired development (one-time)

# Only the introduction of this one-time workflow runs the expensive shards.
# Remove the workflow once all evidence artifacts have been independently
# inspected and retained. No routine PR event/test re-executes the batch.
on:
  pull_request:
    paths:
      - '.github/workflows/experiment-002-v2-one-time.yml'

permissions:
  contents: read

jobs:
  matched-pairs:
    name: Paired seeds shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Validate sealed 12-pair shard
        run: bash scripts/pilot-paired-002-shard.sh /tmp/reputation-v2-paired-shard-${{ matrix.shard }} ${{ matrix.shard }}
      - name: Preserve original signed Hiyal parent and fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-002-v2-paired-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          path: /tmp/reputation-v2-paired-shard-${{ matrix.shard }}/

  descriptive-aggregation:
    name: Aggregate predeclared 36 independent societies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: matched-pairs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: experiment-002-v2-paired-shard-*
          path: /tmp/reputation-v2-all-shards
      - name: Verify evidence sets, exact seed domain and descriptive precision
        run: |
          set -euo pipefail
          root=/tmp/reputation-v2-all-shards
          dest=/tmp/reputation-v2-aggregate
          mkdir -p "$dest"
          for shard in 0 1 2; do
            dir="$root/experiment-002-v2-paired-shard-$shard"
            [[ -f "$dir/SHA256SUMS" ]] || exit 2
            (cd "$dir" && sha256sum --check --strict --status SHA256SUMS)
            jq -e --argjson expected "$shard" '.layout=="paired-prior" and .shard==$expected and (.seeds|length)==12 and .actors==20 and .degree==4 and .checkpoint==200 and .total==600' "$dir/batch-plan.json"
            sha256sum "$dir/SHA256SUMS" >> "$dest/shard-manifests.txt"
          done
          # All 36 original parent seed pairs were committed before simulation.
          jq -s -e '[.[].seeds[]] | sort == [range(98000;98036)]' "$root"/experiment-002-v2-paired-shard-*/batch-plan.json
          [[ "$(jq -rs '[.[].source_revision]|unique|length' "$root"/experiment-002-v2-paired-shard-*/batch-plan.json)" == 1 ]]
          [[ "$(jq -rs '[.[].hiyal_revision]|unique|length' "$root"/experiment-002-v2-paired-shard-*/batch-plan.json)" == 1 ]]
          jq -s -f scripts/paired-summary-002.jq "$root"/experiment-002-v2-paired-shard-*/paired-*/paired-report.json > "$dest/paired-summary.json"
          jq -e '.parent_pairs==36 and .scientific_status=="EXPLORATORY_NOT_CONFIRMATORY" and (.seeds|sort)==[range(98000;98036)]' "$dest/paired-summary.json"
          jq --argjson t 2.030108 '. + {
            uncertainty_display:{
              meaning:"Approximate unadjusted 95% t intervals across 36 independent synthetic parent societies; not preregistered or evidence about people",
              assumptions:"Independent seed runs; descriptive exploratory analysis, no multiple-testing control",
              prior_gap_interval:[(.prior_gap.mean - $t*.prior_gap.sd/sqrt(.parent_pairs)),(.prior_gap.mean + $t*.prior_gap.sd/sqrt(.parent_pairs))],
              matched_difference_interval:[(.matched_difference.mean - $t*.matched_difference.sd/sqrt(.parent_pairs)),(.matched_difference.mean + $t*.matched_difference.sd/sqrt(.parent_pairs))],
              null_symmetry_interval:[(.no_prior_gap.mean - $t*.no_prior_gap.sd/sqrt(.parent_pairs)),(.no_prior_gap.mean + $t*.no_prior_gap.sd/sqrt(.parent_pairs))]
            }}' "$dest/paired-summary.json" > "$dest/paired-summary-with-uncertainty.json"
          (cd "$dest"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS; sha256sum --check --strict --status SHA256SUMS)
          echo BEGIN-V2-36-PAIR-SUMMARY
          cat "$dest/paired-summary-with-uncertainty.json"
          echo END-V2-36-PAIR-SUMMARY
          echo BEGIN-V2-36-PAIR-SEAL
          sha256sum "$dest/SHA256SUMS"
          echo END-V2-36-PAIR-SEAL
      - name: Preserve aggregate with shard seal references
        uses: actions/upload-artifact@v4
        with:
          name: experiment-002-v2-paired-36-summary
          retention-days: 90
          if-no-files-found: error
          path: /tmp/reputation-v2-aggregate/
