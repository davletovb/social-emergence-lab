[package]
name = "social-emergence-lab"
default-run = "social-emergence-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
hiyal = { git = "https://github.com/davletovb/hiyal", rev = "c6f3d5d650457077eaff4e26a0060bc6cee5dbdd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
