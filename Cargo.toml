[package]
name = "social-emergence-lab"
default-run = "social-emergence-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[dependencies]
hiyal = { git = "https://github.com/davletovb/hiyal", rev = "4d2cc3558576f56d8cd6e7acc107c194ade87a24" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
