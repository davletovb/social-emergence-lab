[package]
name = "social-emergence-lab"
default-run = "social-emergence-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[dependencies]
hiyal = { git = "https://github.com/davletovb/hiyal", rev = "ee27f7f296ab7275988b9f4aaffba52143304ba6" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
