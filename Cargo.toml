[package]
name = "social-emergence-lab"
default-run = "social-emergence-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[dependencies]
hiyal = { git = "https://github.com/davletovb/hiyal", rev = "55d30ea7143f5e3318289b2920c25f32d24bc4d9" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
